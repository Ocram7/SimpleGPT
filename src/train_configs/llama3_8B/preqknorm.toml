# torchtitan Config.toml

[job]
dump_folder = "./outputs"
description = "preqknorm_8B_lr0.001"

[profiling]
enable_profiling = false
save_traces_folder = "profile_trace"
profile_freq = 100

[metrics]
log_freq = 1
enable_tensorboard = true
save_tb_folder = "tb"
enable_color_printing=false
enable_wandb = true
wandb_comment = ""

[model]
name = "llama3_preqknorm"
flavor = "8B" #1B 271M 162M 102M 67M 39M
norm_type = "rmsnorm"  # [layernorm, np_layernorm, rmsnorm, fused_rmsnorm]
tokenizer_path = "/data/models/Meta-Llama-3-8B/original/tokenizer.model"


[optimizer]
name = "AdamW"
lr = 1e-3
weight_decay = 0.05

[training]
seed = 42
batch_size = 3 # total_bs =batch_size * #num_gpu * grad_accumulation_steps
seq_len = 2048
warmup_steps = 200  # lr scheduler warm up. 1% of total steps
max_norm = 1.0  # grad norm clipping
steps = 20000
data_parallel_degree = -1
tensor_parallel_degree = 1
fp8_linear = ""
compile = true
dataset = "c4"
dataset_path = "/data/datasets/c4_en/en"
grad_accumulation_steps = 8   # total_bs = grad_accumulation_steps * batch_size * num_gpus

[experimental]
pipeline_parallel_degree = 1

[checkpoint]
resume = false
enable_checkpoint = true
folder = "./your_path"
interval_type = "steps"
interval = 50000000
model_weights_only = false
export_dtype = "float32"
async_mode = "disabled" # ["disabled", "async", "async_with_pinned_mem"]

[activation_checkpoint]
mode = 'none'  # ['none', 'selective', 'full'] # for Adam-mini we can use none, will be faster
selective_ac_option = 'op'  # 'int' = ac every positive int layer or 'op', ac based on ops policy
